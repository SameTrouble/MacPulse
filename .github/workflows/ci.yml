name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, Test & Lint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --no-cache

      - name: Build
        run: xcodebuild -project MacPulse.xcodeproj -scheme MacPulse -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Test
        run: xcodebuild -project MacPulse.xcodeproj -scheme MacPulse -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
