included:
  - Sources
  - Tests
disabled_rules:
  - todo
opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - last_where
  - redundant_type_annotation
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
line_length:
  warning: 140
type_body_length:
  warning: 300
file_length:
  warning: 400
function_body_length:
  warning: 60
identifier_name:
  min_length: 2
  allowed_symbols: "_"
